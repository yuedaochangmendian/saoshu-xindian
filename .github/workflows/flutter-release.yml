name: Flutter release build

on:
  workflow_dispatch:

# 同 workflow 串行：双重 dispatch（历史两次实录）不再并行跑两个
# 20+ 分钟构建然后在 gh release create 撞 tag。
concurrency:
  group: flutter-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # 数据库不入库（332 MiB）。还原优先级：
      # 1) db-latest release 的 saoshu.db.gz（数据清理后的最新库，手工更新）
      # 2) 最近一个带 source.zip 的原生版 Release（回退；当前 v3.43）
      - name: Restore saoshu.db into assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download db-latest --repo "$GITHUB_REPOSITORY" \
              -p 'saoshu.db.gz' -O flutter/assets/saoshu.db.gz 2>/dev/null; then
            echo "restored from db-latest"
            ls -l flutter/assets/saoshu.db.gz
          else
            echo "db-latest unavailable, falling back to source.zip releases"
            TAG=""
            for PAGE in 1 2 3; do
              TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$PAGE" \
                --jq '[.[] | select(any(.assets[]; .name | endswith("source.zip")))][0].tag_name // empty')
              if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
                echo "found source zip release: $TAG (page $PAGE)"
                break
              fi
              TAG=""
            done
            if [ -z "$TAG" ]; then
              TAG="v3.43"
              echo "fallback to $TAG"
            fi
            echo "restoring saoshu.db from $TAG"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*source.zip' -O /tmp/src.zip
            unzip -j /tmp/src.zip 'app/src/main/assets/saoshu.db' -d /tmp/
            ls -l /tmp/saoshu.db
            gzip -9 -c /tmp/saoshu.db > flutter/assets/saoshu.db.gz
            ls -l flutter/assets/saoshu.db.gz
          fi

          # 资产完整性校验：容器魔数 + gzip CRC + SQLite quick_check +
          # user_version（db-latest 忘更新 / 回退链拿到旧库都在这里现形）。
          MAGIC=$(od -An -tx1 -N2 flutter/assets/saoshu.db.gz | tr -d ' \n')
          if [ "$MAGIC" != "1f8b" ]; then
            echo "FATAL: asset is not a gzip container (magic=$MAGIC)"
            exit 1
          fi
          gzip -t flutter/assets/saoshu.db.gz
          gzip -dc flutter/assets/saoshu.db.gz > /tmp/verify.db
          QC=$(sqlite3 /tmp/verify.db "PRAGMA quick_check;" | head -1)
          UV=$(sqlite3 /tmp/verify.db "PRAGMA user_version;")
          rm -f /tmp/verify.db
          echo "asset verify: quick_check=$QC user_version=$UV"
          if [ "$QC" != "ok" ]; then
            echo "FATAL: restored database failed quick_check"
            exit 1
          fi
          if [ "${UV:-0}" -lt 18 ]; then
            echo "FATAL: stale asset db (user_version=$UV < 18) - db-latest missing or fallback used"
            exit 1
          fi

      - name: Read version from pubspec
        working-directory: .
        run: |
          VERSION=$(grep -oP '^version: \K[^+]+' flutter/pubspec.yaml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Dump build log on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-log-${GITHUB_RUN_ID}"             --repo "$GITHUB_REPOSITORY" --prerelease             --title "CI log ${{ github.run_id }}"             --notes "auto log dump"             "flutter/build.log" || true

      - name: Sign APK
        working-directory: .
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > /tmp/debug.keystore
          "$BT/zipalign" -f -p 4 flutter/build/app/outputs/flutter-apk/app-release.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "saoshu-xindian-flutter-${VERSION}.apk" /tmp/aligned.apk
          "$BT/apksigner" verify "saoshu-xindian-flutter-${VERSION}.apk"
          "$BT/zipalign" -c -p 4 "saoshu-xindian-flutter-${VERSION}.apk"

      - name: Create prerelease
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            "saoshu-xindian-flutter-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "扫书新典 v${VERSION}（Flutter 预览版）" \
            --notes "扫书新典 v${VERSION}（CI 自动构建，Flutter 3.35.4；默认预览版，确认稳定后在 Releases 页面手动发布正式版）"
