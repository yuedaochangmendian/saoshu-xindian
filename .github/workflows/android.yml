name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已配置），此处只补本工程要用的版本。
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      # 仓库里没有 gradlew，也不带 332 MiB 的 saoshu.db（未入库），
      # 所以这里只做编译与 lint 检查，不产出可发布 APK。
      - name: Build and lint
        run: gradle --no-daemon --console=plain assembleDebug lintDebug
