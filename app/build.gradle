plugins {
    id "com.android.application"
}

android {
    namespace "com.saoshu.xindian"
    compileSdk 35

    defaultConfig {
        applicationId "com.saoshu.xindian"
        minSdk 23
        targetSdk 34
        versionCode 41
        versionName "3.20"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/*"]
        }
    }
}
