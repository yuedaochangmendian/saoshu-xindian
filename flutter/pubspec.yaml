name: saoshu_xindian
description: 扫书新典 —— 离线扫书资料阅读器（Flutter 版）
publish_to: 'none'
version: 4.3.0+98

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/saoshu.db.gz
    - assets/glossary_terms.json
    - assets/icons/preview_default.png
    - assets/icons/preview_photo.png
    - assets/icons/preview_book.png
    - assets/icons/preview_reading.png
